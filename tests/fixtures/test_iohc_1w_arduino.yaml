# Production-shaped IOHC 1W fixture for the XIAO's Arduino OTA migration path.
esphome:
  name: test-somfy-iohc-1w-arduino

esp32:
  board: seeed_xiao_esp32s3
  framework:
    type: arduino

logger:

external_components:
  - source:
      type: local
      path: ../../components

spi:
  clk_pin: GPIO07
  mosi_pin: GPIO09
  miso_pin: GPIO08

cc1101:
  id: cc1101_radio
  cs_pin: GPIO04
  gdo0_pin: GPIO02
  frequency: 868.95MHz
  modulation_type: 2-FSK
  symbol_rate: 38400
  fsk_deviation: 19.2kHz
  filter_bandwidth: 100kHz
  output_power: 10
  manchester: false
  packet_mode: true
  packet_length: 0
  crc_enable: false
  sync_mode: "16/16"
  sync1: 0x57
  sync0: 0xFD
  num_preamble: 7

somfy:
  - id: iohc_hub
    type: iohc
    cc1101_id: cc1101_radio

button:
  - platform: template
    id: prog_button
    name: "Prog Button"
    entity_category: config
    disabled_by_default: true
  - platform: template
    id: my_button
    name: "MY Button"

text_sensor:
  - platform: template
    id: detected_remote
    name: "Detected Remote"
    entity_category: diagnostic

cover:
  - platform: somfy
    type: iohc
    name: "Test IOHC 1W Arduino Cover"
    device_class: shutter
    open_duration: 31.2s
    close_duration: 29.8s
    my_position: 42%
    my_button: my_button
    storage_namespace: somfy
    storage_key: IohcArd
    initial_rolling_code: 30
    repeat_command_count: 6
    remote_code: 0x123456
    encryption_key: "00112233445566778899AABBCCDDEEFF"
    prog_button: prog_button
    somfy_id: iohc_hub
    mode: 1w
    allowed_remotes:
      - 0x654321
    detected_remote: detected_remote
