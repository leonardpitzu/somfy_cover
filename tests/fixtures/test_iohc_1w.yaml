# Minimal ESPHome config to compile-test the Somfy io-homecontrol cover in 1W mode.
esphome:
  name: test-somfy-iohc-1w

esp32:
  board: seeed_xiao_esp32s3
  framework:
    type: esp-idf

logger:

external_components:
  - source:
      type: local
      path: ../../components

spi:
  clk_pin: GPIO07
  mosi_pin: GPIO09
  miso_pin: GPIO08

cc1101:
  id: cc1101_radio
  cs_pin: GPIO04
  gdo0_pin: GPIO02
  frequency: 868.95MHz
  modulation_type: 2-FSK
  symbol_rate: 38400
  fsk_deviation: 19.2kHz
  filter_bandwidth: 100kHz
  manchester: false
  packet_mode: true
  packet_length: 0
  crc_enable: false
  sync_mode: "16/16"
  sync1: 0x57
  sync0: 0xFD
  num_preamble: 7

somfy:
  - id: iohc_hub
    type: iohc
    cc1101_id: cc1101_radio

button:
  - platform: template
    id: prog_button
    name: "Prog Button"
  - platform: template
    id: my_button
    name: "MY Button"

text_sensor:
  - platform: template
    id: detected_remote
    name: "Detected Remote"

cover:
  - platform: somfy
    type: iohc
    name: "Test IOHC 1W Cover"
    open_duration: 30s
    close_duration: 30s
    my_position: 42%
    my_button: my_button
    storage_key: Iohc1W
    initial_rolling_code: 0x0020
    repeat_command_count: 6
    remote_code: 0x123456
    prog_button: prog_button
    somfy_id: iohc_hub
    allowed_remotes:
      - 0x654321
    detected_remote: detected_remote
