substitutions:
  devicename: shades-iohc
  devicelabel: Shades iohc

packages:
  common: !include packages/common.yaml

external_components:
  source: github://leonardpitzu/esphome_somfy@main
  components: [somfy]
  refresh: 600s

logger:
  level: DEBUG

esphome:
  comment: $devicelabel

esp32:
  variant: esp32s3

web_server:
  port: 80
  log: false
  local: true
  version: 3

spi:
  clk_pin: GPIO07
  mosi_pin: GPIO09
  miso_pin: GPIO08

# CC1101 configured for io-homecontrol (868 MHz, 2-FSK)
# The somfy iohc component will auto-configure modulation parameters.
cc1101:
  id: cc1101_radio
  cs_pin: GPIO04
  gdo0_pin: GPIO02
  frequency: 868.95MHz
  modulation_type: 2-FSK
  symbol_rate: 38400
  fsk_deviation: 19.2kHz
  filter_bandwidth: 100kHz
  output_power: 10
  manchester: false
  packet_mode: true
  packet_length: 0
  crc_enable: false
  sync_mode: "16/16"
  sync1: 0x57
  sync0: 0xFD
  num_preamble: 7

somfy:
  - id: iohc_radio
    type: iohc
    cc1101_id: cc1101_radio

button:
  - platform: template
    id: "program_bedroom_blind"
    name: "Prog Bedroom Blind"
    entity_category: config
    disabled_by_default: true
  - platform: template
    id: my_bedroom_blind
    name: "Bedroom Blind MY"

cover:
  - platform: somfy
    type: iohc
    id: bedroom_blind
    name: "Bedroom Blind"
    device_class: shutter
    open_duration: 30s
    close_duration: 30s
    my_position: 50%
    my_button: my_bedroom_blind
    storage_key: KeyBedBlind
    initial_rolling_code: 1
    repeat_command_count: 6
    remote_code: 0xAABBCC
    prog_button: program_bedroom_blind
    somfy_id: iohc_radio
    encryption_key: !secret bedroom_blind_iohc_key
